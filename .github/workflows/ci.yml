name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tokens, lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # scripts/build-tokens.ts runs as TypeScript directly, which needs Node 22.18 or later.
          node-version: 26
          cache: npm
      - run: npm ci
      - name: tokens.css matches tokens.json
        run: npm run tokens -- --check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright
    # Pinned: Playwright 1.60 has no Chromium build for Ubuntu 26.04 ("Playwright does not
    # support chromium on ubuntu26.04-x64"), and on ubuntu-latest the browser install failed
    # that way. Move back to ubuntu-latest once @playwright/test supports 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and serves the app itself, and e2e/support/mockApi.ts
      # stands in for the backend, so no secrets are needed.
      - run: npm run test:e2e
        env:
          PW_TEST_HTML_REPORT_OPEN: never
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
