management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          ssl: true

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET:Y2F0Y2hfbWVfaWZfeW91X2Nhbl9oYWNrZXJfYm95XzEyMw==}
  expiration: 86400000 # 24 hours

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
