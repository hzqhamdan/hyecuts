management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # "always" leaked DB connection state and disk space to the unauthenticated
      # /actuator/health probe; "when-authorized" still gives the platform's
      # health check a plain UP/DOWN, full detail only for an authenticated admin.
      show-details: when-authorized

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    # Was `true` — every query with bound parameters (emails, phone numbers)
    # was being written to production logs.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          ssl: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: native

logging:
  # Was DEBUG for security/web — Spring Security DEBUG logs authentication
  # tokens and web DEBUG logs request/response bodies, so this was writing
  # credentials and PII to production logs on every request.
  level:
    org.springframework.security: WARN
    org.springframework.web: WARN
    com.hyecuts.loyalty: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}

frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
