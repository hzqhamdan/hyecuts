spring:
  datasource:
    # Prioritize SPRING_DATASOURCE_URL, then construct from individual Railway PG variables
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:zephyr.proxy.rlwy.net}:${PGPORT:41721}/${PGDATABASE:railway}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          ssl: true

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET:Y2F0Y2hfbWVfaWZfeW91X2Nhbl9oYWNrZXJfYm95XzEyMw==}
  expiration: 86400000 # 24 hours

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
